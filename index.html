<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sprinktrap Play Store</title>
<style>
:root{--ac:#5b35e8;--tx:#1e1263;--mu:#6f64b8;--gl:rgba(255,255,255,.6);--bd:rgba(110,80,230,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;color:var(--tx);background:radial-gradient(circle at 20% 10%,#e4dbff,transparent 50%),radial-gradient(circle at 90% 60%,#d9ccff,transparent 50%),#f6f2ff;min-height:100vh}
#app{max-width:480px;margin:auto;padding:14px 14px 100px}
header{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:28px;line-height:1}h1 small{display:block;font-size:22px;font-weight:500}
.ib{width:46px;height:46px;border-radius:50%;border:1px solid var(--bd);background:var(--gl);font-size:20px;margin-left:8px;cursor:pointer;backdrop-filter:blur(8px)}
.g{background:var(--gl);border:1px solid var(--bd);border-radius:18px;backdrop-filter:blur(10px)}
#q{width:100%;margin:14px 0;padding:14px 16px;border-radius:18px;border:1px solid var(--bd);background:var(--gl);font-size:15px;color:var(--tx)}
.ban{border-radius:24px;padding:22px;color:#fff;min-height:190px;background:radial-gradient(circle at 80% 40%,#4c6b2a55,transparent 45%),radial-gradient(#ffffff33 1px,transparent 1px) 0 0/28px 28px,#121226;box-shadow:0 10px 26px #3b1fa855;position:relative;overflow:hidden}
.ban h2{margin:0;font-size:30px;line-height:1.05}.ban h2 span{color:#d9d2ff}
.ban p{margin:8px 0 14px;font-size:14px;max-width:55%}
.ch{position:absolute;right:0;top:0;height:100%;width:auto;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent,#000 40%);mask-image:linear-gradient(to right,transparent,#000 40%)}
.ban h2,.ban p,.ban button{position:relative;z-index:1}
.bt{background:linear-gradient(135deg,#6a3df0,#4a22d0);color:#fff;border:0;border-radius:16px;padding:13px 20px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
.chips{display:flex;gap:8px;margin:16px 0;overflow-x:auto}
.chip{padding:12px 16px;border-radius:22px;border:1px solid var(--bd);background:var(--gl);color:var(--ac);font-size:15px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ac);color:#fff}
.wel{text-align:center;padding:26px 10px;font-size:22px;font-weight:700}.wel div{font-size:46px;color:#8f6bff}.wel p{font-weight:400;font-size:16px;color:var(--mu);margin:8px 0 0}
.cd{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px}
.ic{width:56px;height:56px;border-radius:14px;background:#e4dcff;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.inf{flex:1;min-width:0}.inf b{display:block}.inf span{color:var(--mu);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border-radius:26px 26px 0 0}
nav button{background:none;border:0;color:var(--mu);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}nav button i{font-style:normal;font-size:24px}nav button.on{color:var(--ac);font-weight:700}
.ov{position:fixed;inset:0;background:#f6f2ff;z-index:5;overflow:auto;padding:14px;display:none}.ov.on{display:block}
#stabs{flex-direction:column;overflow:visible}#stabs .chip{width:100%;text-align:left}.ov>div{max-width:480px;margin:auto}
input,textarea,select{width:100%;margin-top:8px;padding:12px;border-radius:14px;border:1px solid var(--bd);background:#fff;color:var(--tx);font-size:14px}
label{display:block;margin-top:10px;font-size:13px;color:var(--mu)}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);font-size:14px}.row span{color:var(--mu);text-align:right;word-break:break-word}
.m{margin-top:10px;font-size:13px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;display:none;z-index:9}
.warn{background:#ffe9c7;padding:12px;border-radius:12px;font-size:13px;margin-top:10px}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ВСТАВЬ СВОИ ДАННЫЕ из Firebase: Настройки проекта → Ваши приложения → Веб
const firebaseConfig = {
  apiKey: "ВСТАВЬ",
  authDomain: "ВСТАВЬ.firebaseapp.com",
  projectId: "ВСТАВЬ",
  storageBucket: "ВСТАВЬ.appspot.com",
  messagingSenderId: "ВСТАВЬ",
  appId: "ВСТАВЬ"
};
const V="1.0.1";
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ok=!firebaseConfig.apiKey.startsWith("ВСТАВЬ");
let apps=[],tab="home",user=null,db,st,au,stab="acc";
const toast=t=>{const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)};

const TABS=[["home","🏠","Главная"],["game","🎮","Игры"],["app","🧩","Приложения"],["deal","🏷️","Акции"]];
function go(t){tab=t;draw()}
function drawTabs(){
  const mk=(box,chip)=>{box.textContent="";TABS.forEach(([k,i,n])=>{const b=el("button",chip?"chip"+(tab==k?" on":""):(tab==k?"on":""));
    if(chip){b.textContent=i+" "+n}else{const s=el("i",null,i);b.append(s,n)}
    b.onclick=()=>go(k);box.append(b)})};
  mk($("chips"),true);mk($("nav"),false);
}
function card(a){
  const c=el("div","g cd");
  let ic;if(a.iconUrl){ic=el("img");ic.src=a.iconUrl}else ic=el("div",null,a.cat=="app"?"🧩":"🎮");ic.className="ic";
  const i=el("div","inf");i.append(el("b",null,a.name),el("span",null,a.desc||""));
  const d=el("a","bt","Скачать");d.href=a.apkUrl;d.rel="noopener";
  c.append(ic,i,d);return c;
}
function draw(){
  drawTabs();
  const home=tab=="home";
  $("ban").style.display=$("wel").style.display=home?"block":"none";
  const q=$("q").value.trim().toLowerCase();
  const l=$("list");l.textContent="";
  if(tab=="deal"){l.append(el("div","wel","Скоро здесь появятся акции"));return}
  let a=apps.filter(x=>home||x.cat==tab);
  if(q)a=a.filter(x=>(x.name+" "+(x.desc||"")).toLowerCase().includes(q));
  if(!a.length)l.append(el("div","m","Пока пусто."));
  a.forEach(x=>l.append(card(x)));
}
$("q").oninput=draw;
$("togames").onclick=()=>go("game");
$("bell").onclick=()=>toast("Новых уведомлений нет");

// ---- Firebase
if(!ok)$("warn").style.display="block";
else{
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();st=firebase.storage();au=firebase.auth();
  db.collection("apps").orderBy("created","desc").onSnapshot(s=>{apps=s.docs.map(d=>d.data());draw()},e=>toast("Ошибка чтения: "+e.message));
  au.onAuthStateChanged(u=>{user=u;if($("set").classList.contains("on"))sPage(stab)});
}

// ---- Публикация
$("addb").onclick=()=>{if(!user){openSet("acc");toast("Сначала войди в аккаунт");return}$("pub").classList.add("on")};
$("pcl").onclick=()=>$("pub").classList.remove("on");
function up(f,dir,cb){return new Promise((res,rej)=>{const r=st.ref(dir+"/"+Date.now()+"_"+f.name.replace(/[^\w.\-]/g,"_"));const t=r.put(f);
  t.on("state_changed",s=>cb&&cb(s.bytesTransferred/s.totalBytes*100),rej,()=>r.getDownloadURL().then(res,rej))})}
$("send").onclick=async()=>{
  if(!ok||!user)return;
  const m=$("pmsg"),p=$("prog"),b=$("send");
  const name=$("name").value.trim(),af=$("apkFile").files[0],icf=$("iconFile").files[0];
  let url=$("apkUrl").value.trim();
  if(!name)return m.textContent="Введи название";
  if(!af&&!url)return m.textContent="Вставь ссылку или выбери APK";
  b.disabled=true;m.textContent="Загрузка...";
  try{
    p.style.display="block";
    if(af)url=await up(af,"apk",v=>p.value=v);
    const iconUrl=icf?await up(icf,"icons"):"";
    await db.collection("apps").add({name,desc:$("desc").value.trim(),cat:$("cat").value,apkUrl:url,iconUrl,owner:user.uid,created:firebase.firestore.FieldValue.serverTimestamp()});
    m.textContent="✅ Опубликовано!";["name","desc","apkUrl","apkFile","iconFile"].forEach(i=>$(i).value="");
  }catch(e){m.textContent="Ошибка: "+e.message}
  p.style.display="none";b.disabled=false;
};

// ---- Настройки
const STABS=[["acc","Аккаунт"],["dev","Устройства"],["about","О приложении"],["upd","Обновление"],["mem","Данные и память"]];
function openSet(k){$("set").classList.add("on");sPage(k||stab)}
$("gear").onclick=()=>openSet();
$("scl").onclick=()=>$("set").classList.remove("on");
const row=(a,b)=>{const r=el("div","row");r.append(el("div",null,a),el("span",null,b));return r};
function sPage(k){
  stab=k;const tb=$("stabs");tb.textContent="";
  STABS.forEach(([i,n])=>{const c=el("button","chip"+(i==k?" on":""),n);c.onclick=()=>sPage(i);tb.append(c)});
  const B=$("sbody");B.textContent="";
  if(k=="acc"){
    if(!ok){B.append(el("div","m","Сначала подключи Firebase."));return}
    if(user){
      B.append(row("Почта",user.email),row("ID аккаунта",user.uid.slice(0,10)+"…"),row("Создан",new Date(user.metadata.creationTime).toLocaleDateString("ru")),row("Последний вход",new Date(user.metadata.lastSignInTime).toLocaleString("ru")),row("Моих приложений",String(apps.filter(a=>a.owner==user.uid).length)));
      const r=el("button","bt","Сменить пароль (письмо на почту)");r.style.marginTop="14px";r.onclick=()=>au.sendPasswordResetEmail(user.email).then(()=>toast("Письмо отправлено"),e=>toast(e.message));
      const o=el("button","chip","Выйти");o.style.cssText="width:100%;margin-top:10px";o.onclick=()=>au.signOut();
      B.append(r,o);
    }else{
      const e=el("input");e.type="email";e.placeholder="Почта";const p=el("input");p.type="password";p.placeholder="Пароль (от 6 символов)";
      const m=el("div","m");
      const run=f=>()=>au[f](e.value.trim(),p.value).catch(x=>m.textContent="Ошибка: "+x.message);
      const l=el("button","bt","Войти");l.style.cssText="width:100%;margin-top:14px";l.onclick=run("signInWithEmailAndPassword");
      const r=el("button","chip","Регистрация");r.style.cssText="width:100%;margin-top:8px";r.onclick=run("createUserWithEmailAndPassword");
      B.append(e,p,l,r,m);
    }
  }
  if(k=="dev"){
    const n=navigator;
    B.append(row("Система",/Android/.test(n.userAgent)?"Android":/iPhone|iPad/.test(n.userAgent)?"iOS":n.platform),row("Экран",innerWidth+"×"+innerHeight+" (x"+devicePixelRatio+")"),row("Язык",n.language),row("Сеть",n.onLine?"онлайн":"офлайн"),row("Браузер",n.userAgent.slice(0,60)+"…"));
    B.append(el("div","warn","Чтобы установить APK, разреши установку из неизвестных источников для браузера в настройках телефона."));
  }
  if(k=="about"){
    B.append(row("Версия",V),row("Проект Firebase",ok?firebaseConfig.projectId:"не подключён"),row("Приложений в магазине",String(apps.length)),row("Хостинг","GitHub Pages"));
  }
  if(k=="upd"){
    B.append(row("Текущая версия",V));
    const m=el("div","m");const b=el("button","bt","Проверить обновления");b.style.cssText="width:100%;margin-top:14px";
    b.onclick=async()=>{m.textContent="Проверяю...";try{
      const t=await(await fetch(location.pathname+"?t="+Date.now(),{cache:"no-store"})).text();
      const v=(t.match(/const V="([\d.]+)"/)||[])[1];
      if(v&&v!=V){m.textContent="Доступна версия "+v;const r=el("button","bt","Обновить");r.style.cssText="width:100%;margin-top:10px";r.onclick=()=>location.reload(true);B.append(r)}
      else m.textContent="✅ У тебя последняя версия"}catch(e){m.textContent="Не удалось проверить"}};
    B.append(b,m);
  }
  if(k=="mem"){
    const m=row("Занято на устройстве","считаю...");B.append(m);
    if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(s=>m.lastChild.textContent=((s.usage||0)/1048576).toFixed(2)+" МБ из "+((s.quota||0)/1048576).toFixed(0)+" МБ");
    B.append(row("Локальные данные",localStorage.length+" записей"));
    const b=el("button","bt","Очистить кэш и данные");b.style.cssText="width:100%;margin-top:14px";
    b.onclick=async()=>{try{localStorage.clear();const ks=await caches.keys();await Promise.all(ks.map(x=>caches.delete(x)))}catch(e){}toast("Очищено");setTimeout(()=>location.reload(),600)};
    B.append(b,el("div","m","Скачанные APK хранятся в телефоне, в папке «Загрузки»."));
  }
}
draw();
</script>
