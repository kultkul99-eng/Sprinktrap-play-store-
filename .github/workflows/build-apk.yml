name: Build APK
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/build-apk.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate Android project and build
        run: |
          set -e
          mkdir -p android && cd android
          mkdir -p "$(dirname settings.gradle)"
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'SprinktrapStore'
          include ':app'
          EOF_0
          mkdir -p "$(dirname build.gradle)"
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_1
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF_2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_2
          mkdir -p "$(dirname app/build.gradle)"
          cat > app/build.gradle <<'EOF_3'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.sprinktrap.store'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.sprinktrap.store'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
                  buildConfigField 'String', 'SITE_URL', '"' + (project.findProperty('siteUrl') ?: 'https://example.com/') + '"'
              }
              buildFeatures { buildConfig true }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.12.0'
          }
          EOF_3
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <application
                  android:label="Sprinktrap Play Store"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"/>
                  </provider>
              </application>
          </manifest>
          EOF_4
          mkdir -p "$(dirname app/src/main/res/xml/file_paths.xml)"
          cat > app/src/main/res/xml/file_paths.xml <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="apk" path="apk/"/>
          </paths>
          EOF_5
          mkdir -p "$(dirname app/src/main/java/com/sprinktrap/store/MainActivity.java)"
          cat > app/src/main/java/com/sprinktrap/store/MainActivity.java <<'EOF_6'
          package com.sprinktrap.store;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.core.content.FileProvider;

          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> chooser;
              private String siteHost;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  siteHost = Uri.parse(BuildConfig.SITE_URL).getHost();
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "AndroidStore");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          try {
                              if (u.startsWith("intent:")) {
                                  Intent i = Intent.parseUri(u, Intent.URI_INTENT_SCHEME);
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(i);
                                  return true;
                              }
                              String h = r.getUrl().getHost();
                              if (h != null && !h.equals(siteHost)) {
                                  Intent i = new Intent(Intent.ACTION_VIEW, r.getUrl());
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(i);
                                  return true;
                              }
                          } catch (Exception e) {
                              return true;
                          }
                          return false;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (chooser != null) chooser.onReceiveValue(null);
                          chooser = cb;
                          try {
                              startActivityForResult(p.createIntent(), 1);
                          } catch (Exception e) {
                              chooser = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  web.loadUrl(BuildConfig.SITE_URL);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == 1 && chooser != null) {
                      chooser.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      chooser = null;
                  }
                  super.onActivityResult(req, res, data);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.evaluateJavascript("document.dispatchEvent(new Event('nativeresume'))", null);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              private void js(final String code) {
                  runOnUiThread(new Runnable() {
                      public void run() {
                          web.evaluateJavascript(code, null);
                      }
                  });
              }

              private void download(String url, String name) {
                  try {
                      File dir = new File(getExternalFilesDir(null), "apk");
                      dir.mkdirs();
                      final File f = new File(dir, name.replaceAll("[^\\w.\\-]", "_") + ".apk");
                      HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                      c.setInstanceFollowRedirects(true);
                      c.setConnectTimeout(20000);
                      c.setReadTimeout(30000);
                      int code = c.getResponseCode();
                      if (code >= 400) throw new Exception("HTTP " + code);
                      long total = c.getContentLengthLong();
                      InputStream in = c.getInputStream();
                      FileOutputStream out = new FileOutputStream(f);
                      byte[] buf = new byte[65536];
                      long got = 0;
                      int n, last = -1;
                      while ((n = in.read(buf)) > 0) {
                          out.write(buf, 0, n);
                          got += n;
                          if (total > 0) {
                              int p = (int) (got * 100 / total);
                              if (p != last) {
                                  last = p;
                                  js("window.__dl&&window.__dl.prog(" + p + ")");
                              }
                          }
                      }
                      out.close();
                      in.close();
                      js("window.__dl&&window.__dl.done(true,'')");
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  Uri u = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".files", f);
                                  Intent i = new Intent(Intent.ACTION_VIEW);
                                  i.setDataAndType(u, "application/vnd.android.package-archive");
                                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(i);
                              } catch (Exception e) {
                                  web.evaluateJavascript("window.__dl&&0", null);
                              }
                          }
                      });
                  } catch (Exception e) {
                      js("window.__dl&&window.__dl.done(false," + JSONObject.quote(String.valueOf(e.getMessage())) + ")");
                  }
              }

              private class Bridge {
                  @JavascriptInterface
                  public boolean isInstalled(String pkg) {
                      try {
                          getPackageManager().getPackageInfo(pkg, 0);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean open(String pkg) {
                      final Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
                      if (i == null) return false;
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      runOnUiThread(new Runnable() {
                          public void run() {
                              startActivity(i);
                          }
                      });
                      return true;
                  }

                  @JavascriptInterface
                  public void uninstall(final String pkg) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  startActivity(new Intent(Intent.ACTION_DELETE, Uri.parse("package:" + pkg)));
                              } catch (Exception e) {
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void install(final String url, final String name) {
                      new Thread(new Runnable() {
                          public void run() {
                              download(url, name);
                          }
                      }).start();
                  }
              }
          }
          EOF_6
          gradle assembleDebug --no-daemon -PsiteUrl="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          cp app/build/outputs/apk/debug/app-debug.apk ../SprinktrapStore.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: store-app
          name: Sprinktrap Play Store (приложение)
          files: SprinktrapStore.apk
