<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой Магазин</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--txt:#eef0f4;--mut:#8b93a3;--acc:#34c27a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:16px;max-width:640px;margin:auto}
h1{font-size:22px;margin:8px 0 16px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.icon{width:56px;height:56px;border-radius:14px;background:#2a2f3a;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
.info{flex:1;min-width:0}
.info b{display:block}
.info span{color:var(--mut);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.btn,button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;text-decoration:none;cursor:pointer}
details{background:var(--card);border-radius:14px;padding:14px;margin-bottom:16px}
summary{cursor:pointer;font-weight:600}
input,textarea{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid #2f3541;background:#12151a;color:var(--txt);font-size:14px}
label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}
progress{width:100%;margin-top:10px}
#msg{margin-top:10px;font-size:13px}
.warn{background:#3a2a12;padding:12px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<h1>📱 Мой Магазин приложений</h1>
<div id="warn" class="warn" style="display:none">Вставь свои данные Firebase в <code>firebaseConfig</code> внутри index.html.</div>

<details>
<summary>＋ Выложить приложение</summary>
<input id="name" placeholder="Название" maxlength="60">
<textarea id="desc" rows="2" placeholder="Описание" maxlength="200"></textarea>
<label>Иконка (картинка, по желанию)</label>
<input id="iconFile" type="file" accept="image/*">
<label>APK файл (загрузка в Firebase Storage)</label>
<input id="apkFile" type="file" accept=".apk">
<label>или ссылка на APK (например, GitHub Releases)</label>
<input id="apkUrl" placeholder="https://github.com/.../app.apk">
<progress id="prog" value="0" max="100" style="display:none"></progress>
<button id="pub" style="margin-top:12px;width:100%">Опубликовать</button>
<div id="msg"></div>
</details>

<div id="list"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
// ВСТАВЬ СВОИ ДАННЫЕ из Firebase: Настройки проекта → Ваши приложения → Веб
const firebaseConfig = {
  apiKey: "ВСТАВЬ",
  authDomain: "ВСТАВЬ.firebaseapp.com",
  projectId: "ВСТАВЬ",
  storageBucket: "ВСТАВЬ.appspot.com",
  messagingSenderId: "ВСТАВЬ",
  appId: "ВСТАВЬ"
};

const $ = id => document.getElementById(id);
const ok = !firebaseConfig.apiKey.startsWith("ВСТАВЬ");
if (!ok) $("warn").style.display = "block";
let db, storage;
if (ok) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  storage = firebase.storage();
  db.collection("apps").orderBy("created", "desc").onSnapshot(snap => {
    const list = $("list");
    list.textContent = "";
    if (snap.empty) list.textContent = "Пока пусто. Выложи первое приложение!";
    snap.forEach(d => list.appendChild(card(d.data())));
  }, e => $("msg").textContent = "Ошибка чтения: " + e.message);
}

function card(a) {
  const c = document.createElement("div"); c.className = "card";
  let ic;
  if (a.iconUrl) { ic = document.createElement("img"); ic.src = a.iconUrl; }
  else { ic = document.createElement("div"); ic.textContent = "📦"; }
  ic.className = "icon";
  const info = document.createElement("div"); info.className = "info";
  const b = document.createElement("b"); b.textContent = a.name;
  const s = document.createElement("span"); s.textContent = a.desc || "";
  info.append(b, s);
  const dl = document.createElement("a"); dl.className = "btn"; dl.textContent = "Скачать";
  dl.href = a.apkUrl; dl.rel = "noopener";
  c.append(ic, info, dl);
  return c;
}

function upload(file, folder, onProg) {
  return new Promise((res, rej) => {
    const r = storage.ref(folder + "/" + Date.now() + "_" + file.name.replace(/[^\w.\-]/g, "_"));
    const t = r.put(file);
    t.on("state_changed", s => onProg && onProg(s.bytesTransferred / s.totalBytes * 100), rej,
      () => r.getDownloadURL().then(res, rej));
  });
}

$("pub").onclick = async () => {
  if (!ok) return;
  const msg = $("msg"), prog = $("prog"), btn = $("pub");
  const name = $("name").value.trim();
  const apkFile = $("apkFile").files[0], iconFile = $("iconFile").files[0];
  let apkUrl = $("apkUrl").value.trim();
  if (!name) return msg.textContent = "Введи название";
  if (!apkFile && !apkUrl) return msg.textContent = "Выбери APK или вставь ссылку";
  btn.disabled = true; msg.textContent = "Загрузка...";
  try {
    prog.style.display = "block";
    if (apkFile) apkUrl = await upload(apkFile, "apk", p => prog.value = p);
    const iconUrl = iconFile ? await upload(iconFile, "icons") : "";
    await db.collection("apps").add({
      name, desc: $("desc").value.trim(), apkUrl, iconUrl,
      created: firebase.firestore.FieldValue.serverTimestamp()
    });
    msg.textContent = "✅ Опубликовано! Уже видно всем.";
    ["name", "desc", "apkUrl", "apkFile", "iconFile"].forEach(i => $(i).value = "");
  } catch (e) {
    msg.textContent = "Ошибка: " + e.message;
  }
  prog.style.display = "none"; btn.disabled = false;
};
</script>
</body>
</html>
